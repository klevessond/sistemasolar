{% extends 'shared/base.html' %}
{% load static %}

{% block content %}

<div class="container mt-5">
  <div class="row">
      <div class="col-md-10 offset-md-1">
          <div class="card">
              <div class="card-header">
                  Lista de Usuários
              </div>
              <div class="card-body">
                  <table class="table table-striped">
                      <thead>
                          <tr>
                              <th>Usuário</th>
                              <th>Email</th>
                              <th>Primeiro Nome</th>
                              <th>Último Nome</th>
                              <th>Ações</th>
                          </tr>
                      </thead>
                      <tbody>
                          {% for user in users %}
                          <tr>
                              <td>{{ user.username }}</td>
                              <td>{{ user.email }}</td>
                              <td>{{ user.first_name }}</td>
                              <td>{{ user.last_name }}</td>
                              <td>
                                  <a href="{% url 'detalhar_usuarios' user.id %}" class="btn btn-primary">Detalhes</a>
                              </td>
                          </tr>
                          {% endfor %}
                      </tbody>
                  </table>
              </div>
          </div>
      </div>
  </div>
</div>

{% endblock %}
