<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                Cadastro de Inversor
            </div>
            <div class="card-body">
                <form method="post" class="form-horizontal">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6">
                          <div class="form-group row">
                              <label class="col-sm-3 text-end control-label col-form-label">Fabricante:</label>
                              <div class="col-sm-9">
                                  {{ inversorform.fabricante }}
                              </div>
                          </div>
                          <div class="form-group row">
                              <label class="col-sm-3 text-end control-label col-form-label">Modelo:</label>
                              <div class="col-sm-9">
                                  {{ inversorform.modelo }}
                              </div>
                          </div>
                          <div class="form-group row">
                              <label class="col-sm-3 text-end control-label col-form-label">Capacidade (Watt):</label>
                              <div class="col-sm-9">
                                  {{ inversorform.capacidade_watt }}
                              </div>
                          </div>
                        
                          <div class="form-group row">
                              <label class="col-sm-3 text-end control-label col-form-label">Tensão Entrada Máx:</label>
                              <div class="col-sm-9">
                                  {{ inversorform.tensao_entrada_max }}
                              </div>
                          </div>
                        </div>
                        <div class="col-md-6">
                          <div class="form-group row">
                              <label class="col-sm-3 text-end control-label col-form-label">Tensão Saída:</label>
                              <div class="col-sm-9">
                                  {{ inversorform.tensao_saida }}
                              </div>
                          </div>
                          <div class="form-group row">
                              <label class="col-sm-3 text-end control-label col-form-label">Eficiência (%):</label>
                              <div class="col-sm-9">
                                  {{ inversorform.eficiencia }}
                              </div>
                          </div>
                          <div class="form-group row">
                              <label class="col-sm-3 text-end control-label col-form-label">Tipo:</label>
                              <div class="col-sm-9">
                                  {{ inversorform.tipo }}
                              </div>
                          </div>
                          <div class="form-group row">
                              <label class="col-sm-3 text-end control-label col-form-label">Compatibilidade:</label>
                              <div class="col-sm-9">
                                  {{ inversorform.compatibilidade }}
                              </div>
                          </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </form>
            </div>
        </div>
    </div>
</div>
